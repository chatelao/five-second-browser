name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build, test, and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make python3 lz4 dpkg shellcheck binutils curl \
            debootstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools dosfstools debian-archive-keyring parted xz-utils e2fsprogs \
            qemu-system-x86 linux-image-virtual busybox-static cpio gzip

      - name: Lint, build, test, QEMU boot check, and package assets
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            REL_VERSION="${GITHUB_REF_NAME#v}"
          else
            REL_VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          export VERSION="$REL_VERSION"
          shellcheck scripts/*.sh src/*/*.sh tests/*.sh
          python3 -m py_compile src/proxy/cache_proxy.py tests/test_cache_proxy.py
          make build
          make check-isa
          make test
          make package
          bash tests/test_release_bundle.sh
          REQUIRE_QEMU=1 bash tests/test_qemu_boot.sh
          sudo VERSION="$REL_VERSION" bash scripts/build_iso.sh
          sudo VERSION="$REL_VERSION" BASE_ROOTFS="$PWD/build/iso_work/rootfs" bash scripts/build_usb_img.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/HOWTO.md
          files: |
            dist/*.img.xz
            dist/*.iso
            dist/5s-browser_*_amd64.deb
            dist/HOWTO.md
            dist/SHA256SUMS
