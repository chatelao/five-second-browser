name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make python3 lz4 dpkg shellcheck binutils curl \
            debootstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools debian-archive-keyring parted xz-utils e2fsprogs

      - name: Lint, build, test, package .deb, ISO, and USB/SD image
        run: |
          shellcheck scripts/*.sh src/*/*.sh tests/*.sh
          python3 -m py_compile src/proxy/cache_proxy.py tests/test_cache_proxy.py
          make build
          make check-isa
          make test
          make package
          bash tests/test_release_bundle.sh
          sudo VERSION="${GITHUB_REF_NAME#v}" bash scripts/build_iso.sh
          sudo VERSION="${GITHUB_REF_NAME#v}" bash scripts/build_usb_img.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/HOWTO.md
          files: |
            dist/*.img.xz
            dist/*.iso
            dist/5s-browser_0.1.0_amd64.deb
            dist/HOWTO.md
            dist/SHA256SUMS
