# Default ALSA configuration for HP Pavilion 17-g111nz (Realtek ALC3241 on PCH, card 1)
# Prevents Chromium/mpv from defaulting to card 0 (Intel HDMI).

pcm.!default {
    type plug
    slave.pcm "dmixer"
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:PCH,0"
        period_time 0
        period_size 1024
        buffer_size 4096
        rate 48000
    }
    bindings {
        0 0
        1 1
    }
}

ctl.!default {
    type hw
    card PCH
}
